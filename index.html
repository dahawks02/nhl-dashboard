<style>
:root{
  --bg:#e9edf3; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#141922; --muted:#5b6675;
  --line:#dde3ec; --track:#e5eaf1; --accent:#2f66d6; --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
  --ml:#1f6feb; --tot:#e8710a; --sog:#188038; --bad:#c73d57; --good:#12894a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f14; --surface:#161b23; --surface-2:#1c232d; --ink:#e7ecf3; --muted:#93a0b2;
  --line:#28303c; --track:#222a35; --accent:#6693f2; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --ml:#5b9cff; --tot:#ff9a3d; --sog:#43ca7d; --bad:#f0687f; --good:#43ca7d;
}}
:root[data-theme="dark"]{
  --bg:#0c0f14; --surface:#161b23; --surface-2:#1c232d; --ink:#e7ecf3; --muted:#93a0b2;
  --line:#28303c; --track:#222a35; --accent:#6693f2; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --ml:#5b9cff; --tot:#ff9a3d; --sog:#43ca7d; --bad:#f0687f; --good:#43ca7d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 56px}
.top .wrap{padding-bottom:0}
.tnum{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.brand h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.4px;text-transform:uppercase;margin:0;line-height:1}
.brand .tag{color:var(--muted);font-size:12px;font-weight:500;text-align:right}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:1 0 auto;text-align:center;padding:9px 6px;font-weight:600;font-size:13.5px;color:var(--muted);text-decoration:none;
  border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:480px){.tabs{flex-wrap:wrap}}   /* seven tabs: two rows on a phone, so Draft is never hidden off the edge */
main{padding-top:14px}
h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.4px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.logo{width:34px;height:34px;object-fit:contain;flex:none}
.logo.sm{width:22px;height:22px}
/* today */
.ghead{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:14px 14px 8px}
.gteam{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px}
.gteam img{width:44px;height:44px;object-fit:contain}
.gteam .proj{font-size:28px;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.gteam .gk{font-family:"Barlow",sans-serif;font-weight:500;font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.gmid{color:var(--muted);font-size:12px;text-align:center;line-height:1.3;padding-top:16px}
.gmid b{display:block;font-size:14px;color:var(--ink)}
.gmid .pg{display:block;margin-top:34px;font-size:11px}
.pbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:0 14px;background:var(--track);font-size:12px;font-weight:700;color:#fff}
.pbar span{display:flex;align-items:center;padding:0 8px;min-width:0;white-space:nowrap;overflow:hidden}
.pbar .away{background:#6b7a90;justify-content:flex-start}
.pbar .home{background:var(--accent);justify-content:flex-end;margin-left:auto}
.psrc{color:var(--muted);font-size:11px;text-align:center;margin:4px 0 6px}
.picks{border-top:1px solid var(--line);padding:6px 10px 10px}
.pick{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px dashed var(--line)}
.pick:last-child{border-bottom:0}
.ptag{color:#fff;font-weight:700;font-size:11px;text-align:center;border-radius:6px;padding:4px 0}
.ptag.ML{background:var(--ml)}.ptag.TOT{background:var(--tot)}.ptag.SOG{background:var(--sog)}
.pbet{font-weight:600;font-size:14px;line-height:1.25}
.pbet small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pnum{text-align:right;font-size:13px;line-height:1.25}
.pnum b{display:block;font-size:15px}
.pnum .edge{color:var(--good);font-weight:600}
.nopick{color:var(--muted);font-size:12.5px;text-align:center;padding:8px 0 2px}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;color:var(--ink);line-height:1}
.empty{color:var(--muted);text-align:center;padding:30px 0}
/* tables */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
@media (max-width:480px){.hide-sm{display:none}}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:var(--surface-2)}
th.l,td.l{text-align:left}
th.sortable{cursor:pointer;user-select:none;padding-top:12px;padding-bottom:12px}
th.on{color:var(--ink)}
.arr{font-size:9px;margin-left:3px}
tr.band td{background:var(--surface-2)}
.tm{display:flex;align-items:center;gap:8px;font-weight:600}
.rk{color:var(--muted);font-weight:600;min-width:34px;text-align:right}
.bar{position:relative;height:8px;background:var(--track);border-radius:4px;overflow:hidden;min-width:64px}
.bar i{position:absolute;top:0;bottom:0;background:var(--good);border-radius:4px}
.bar i.neg{background:var(--bad)}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.divh{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;color:var(--ink)}
.confh{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;margin:18px 0 0;color:var(--accent)}
/* controls */
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.ctl input,.ctl select,.ctl button{font:600 16px "Barlow",sans-serif;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);
  border-radius:9px;padding:8px 11px;outline:none}   /* 16px: below that iOS zooms the page on focus */
.ctl input{flex:1 1 140px;min-width:0}
.ctl input:focus,.ctl select:focus{border-color:var(--accent)}
.ctl button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin:10px 0 0}
.srow{display:grid;grid-template-columns:auto 1fr 74px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.srow:last-child{border-bottom:0}
.srow .d{color:var(--muted);font-size:12.5px;width:96px}
.srow .o{display:flex;align-items:center;gap:8px;font-weight:600}
.srow .p{text-align:right;font-weight:700}
.srow .p small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.pmini{height:5px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:3px}
.pmini i{display:block;height:100%;background:var(--accent)}
/* dfs + draft */
.tm2{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px;white-space:nowrap}
.onote{display:block;color:var(--tot);font-weight:500;font-size:11px;white-space:normal;line-height:1.25;max-width:220px}   /* override note: its own wrapped line */
tr.grp td{background:var(--surface-2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;text-align:left;padding:6px}
.lurow{display:grid;grid-template-columns:38px 1fr auto auto;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.lurow:last-of-type{border-bottom:0}
.lurow .sl{color:var(--muted);font-size:11px}
.lurow .sal{color:var(--muted);font-size:12px;font-weight:500}
.lufoot{display:flex;justify-content:space-between;gap:8px 14px;padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);flex-wrap:wrap}
.lufoot b{color:var(--ink)}
.tier{display:inline-block;min-width:16px;padding:1px 4px;border-radius:5px;background:var(--surface-2);color:var(--accent);font-size:10px;font-weight:700;text-align:center;margin-left:4px;vertical-align:1px}
tr.drow{cursor:pointer}
tr.taken td{color:var(--muted);text-decoration:line-through}
tr.taken td .tm2,tr.taken td .tier{text-decoration:line-through}
tr.mine td{color:var(--good)}
.sumc{padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.55}
.sumc b{color:var(--ink);font-weight:600}
.empty small{display:block;margin-top:8px;font-size:12px;line-height:1.5}
</style>
</head>

    return isnum? d*(x-y) : d*String(x).localeCompare(String(y),undefined,{numeric:true});});
}
function tableHead(cols, st){
  return cols.map(c=>{const on=c.k===st.key, arr=on?`<span class="arr">${st.dir<0?"&#9660;":"&#9650;"}</span>`:"";
    return `<th class="sortable${c.num?"":" l"}${on?" on":""}" data-key="${c.k}" title="${esc(c.title||"")}">${c.label}${arr}</th>`;}).join("");
}
function bindSort(id, cols, st, redraw){
  document.querySelectorAll(`#${id} th.sortable`).forEach(th=>th.onclick=()=>{
    const k=th.dataset.key, c=cols.find(x=>x.k===k);
    if(st.key===k) st.dir=-st.dir; else {st.key=k; st.dir=c.dflt||(c.num?-1:1);}
    redraw();});
}

/* ---- one side of a game card: logo, code, projected goals (goals model), the goalie priced (unit-tested in test_bugs.R) ---- */
/* gameSide:start */
const gameSide=(t,proj,goalie)=>`<div class="gteam">${logo(t)}${esc(t)}<div class="proj">${proj==null?"&ndash;":num(proj,1)}</div><div class="gk">${goalie?"G "+esc(goalie):"goalie tbd"}</div></div>`;

/* slate:start */
/* One slate renderer for tonight (Today tab) and, after the evening pass, tomorrow (Tomorrow tab):
   the same game cards, win-probability bar, projected goals, goalie and pick rows (Oct 14 2026). */
function renderSlate(games, picks, o){
  const risk=picks.reduce((s,p)=>s+(p.stake||0),0);
  let h=`<h2>${o.title}</h2>${o.sub?`<p class="sub">${o.sub}</p>`:""}
  <div class="stat"><div><b>${games.length}</b>game${games.length===1?"":"s"}</div><div><b>${picks.length}</b>pick${picks.length===1?"":"s"}</div><div><b>${money(risk)}</b>at risk</div></div>`;
  if(!games.length) h+=`<div class="empty">${o.empty||"No games today."}</div>`;      /* picks still list below (replays, postponements) */
  const used=new Set();
  games.forEach(g=>{
    const key=`${g.away_team} @ ${g.home_team}`;
    const gp=picks.map((p,i)=>({p,i})).filter(x=>x.p.game===key); gp.forEach(x=>used.add(x.i));
    const ph=g.p_home==null?null:Math.max(0.02,Math.min(0.98,g.p_home));
    h+=`<div class="card">
      <div class="ghead">${gameSide(g.away_team,g.proj_away,g.away_goalie)}
        <div class="gmid">at<b>${esc(g.start_et||"")}</b><span class="pg">proj. goals</span></div>
        ${gameSide(g.home_team,g.proj_home,g.home_goalie)}</div>
      ${ph==null?`<div class="psrc">no win probability yet</div>`:
        `<div class="pbar"><span class="away" style="width:${((1-ph)*100).toFixed(1)}%">${(1-ph)>=0.18?pct(1-g.p_home):""}</span><span class="home" style="width:${(ph*100).toFixed(1)}%">${ph>=0.18?pct(g.p_home):""}</span></div>
         <div class="psrc">win probability: ${g.prob_src==="market-stacked fair"?"betting fair (market-stacked)":esc(g.prob_src||"goals model")}${g.proj_note?" &middot; "+esc(g.proj_note):""}</div>`}
      <div class="picks">${gp.length?gp.map(x=>pickRow(x.p,false)).join(""):`<div class="nopick">no value found - no picks this game</div>`}</div>
    </div>`;
  });
  const orphan=picks.filter((p,i)=>!used.has(i));
  if(orphan.length) h+=`<div class="divh">Other picks</div><div class="card"><div class="picks">${orphan.map(p=>pickRow(p,true)).join("")}</div></div>`;
  if(games.length||picks.length) h+=`<p class="note">Picks come from data/daily/${esc(o.dayDir||"")}/bets_today.csv: a soft US-book price vs the sharp fair value. Stakes = quarter-Kelly x the market's stake governor.${o.note?" "+o.note:""}</p>`;
  V.innerHTML=h;
}
function renderToday(){
  renderSlate(D.games||[], D.picks||[], {title:`Tonight's slate - ${esc(fmtDate(D.today))}`, dayDir:(D.today||"").replace(/-/g,"")});
}
function renderTomorrow(){
  const t=D.tomorrow;
  if(!t||!t.date){ V.innerHTML=`<h2>Tomorrow</h2><div class="empty">Nothing priced for tomorrow yet. run_closing() prices tomorrow's games at tonight's lines each evening.</div>`; return; }
  renderSlate(t.games||[], t.picks||[], {title:`Tomorrow's slate - ${esc(fmtDate(t.date))}`,
    sub:`evening lines as of ${esc(t.as_of||"")} &middot; evening bets are locked once you bet them; the morning run re-prices and only adds`,
    dayDir:(t.date||"").replace(/-/g,""), empty:"No games tomorrow.",
    note:"Goalies are DailyFaceoff's last-posted starters; the morning run re-prices with the real ones."});
}

function pickRow(p, withGame){

/* ---- DFS: tonight's DraftKings slate (35 projections, 36 cash lineups, 37/38 simulation + tournament portfolio) ---- */
/* dfsHelpers:start */
const dkSlot=p=>{const s=String(p==null?"":p).toUpperCase().split("/")[0].trim(); return s==="G"?"G":s==="D"?"D":s==="C"?"C":(s==="LW"||s==="RW"||s==="W")?"W":"";};
const nextMark=m=>m==="taken"?"mine":m==="mine"?"":"taken";
const fmt0=x=>x==null||isNaN(Number(x))?"":String(Math.round(Number(x))).replace(/\B(?=(\d{3})+(?!\d))/g,",");   /* no locale data needed */
const money0=x=>x==null||isNaN(Number(x))?"":"$"+fmt0(x);
/* dfsHelpers:end */
const DCOLS=[{k:"player",label:"Player",num:false},{k:"salary",label:"Sal",num:true,title:"DraftKings salary"},
  {k:"proj",label:"Proj",num:true,title:"projected DK points (35)"},{k:"value",label:"Val",num:true,title:"projected points per $1,000 of salary"},
  {k:"ceil",label:"Ceil",num:true,title:"90th-percentile night from the joint slate simulation (37)"},
  {k:"own",label:"Own",num:true,title:"ownership proxy (38): 1 = the chalkiest player on the slate"}];
const dst={pos:"All",st:{key:"proj",dir:-1},all:false,lu:"cash",n:1};
function renderDFS(){
  const d=D.dfs, dt=esc(fmtDate(D.today));
  let h=`<h2>DraftKings slate</h2>`;
  if(!d||!d.players||!d.players.length){
    V.innerHTML=h+`<p class="sub">${dt}</p><div class="empty">No DFS projections for today.<small>Export tonight's contest salaries from the DraftKings lobby to data/daily/DKSalaries.csv, then run <b>run_dfs()</b> in RStudio after run_predict().</small></div>`;return;}
  const rows=d.players.map(r=>({...r,slot:dkSlot(r.dk_pos||r.pos)})).filter(r=>r.slot&&(!d.salaries||r.salary!=null));
  const awayTeams=new Set((D.games||[]).map(g=>g.away_team)), vsAt=(t,o)=>o?(awayTeams.has(t)?" @ ":" vs ")+esc(o):"";
  h+=`<p class="sub">${dt} &middot; ${rows.length} players${d.salaries?"":" &middot; <b>no salaries</b> (projections only)"}${d.sim?"":" &middot; no simulation yet (ceiling / own blank)"} &middot; built ${esc(d.built||"")}</p>`;
  const has=k=>!!(k==="cash"?(d.cash&&d.cash.length):(d.gpp&&d.gpp.length));
  if(!has(dst.lu)) dst.lu=has("cash")?"cash":has("gpp")?"gpp":dst.lu;
  const L=(dst.lu==="gpp"?d.gpp:d.cash)||[]; const nums=[...new Set(L.map(x=>x.lineup))];
  if(!nums.includes(dst.n)) dst.n=nums[0];
  const cur=L.filter(x=>x.lineup===dst.n);
  h+=`<div class="ctl"><button id="lucash" class="${dst.lu==="cash"?"on":""}">Cash lineup</button><button id="lugpp" class="${dst.lu==="gpp"?"on":""}">Tournament</button>
    ${nums.length>1?`<select id="lunum">${nums.map(n=>`<option value="${n}"${n===dst.n?" selected":""}>lineup ${n} of ${nums.length}</option>`).join("")}</select>`:""}</div>`;
  if(!cur.length){ h+=`<div class="card"><div class="empty">${dst.lu==="gpp"?"No tournament lineups yet: run_dfs() builds them (37 + 38).":"No cash lineup yet: run_dfs() builds it (36)."}</div></div>`; }
  else{
    const sal=cur.reduce((s,x)=>s+(x.salary||0),0), pr=cur.reduce((s,x)=>s+(x.proj||0),0), g=cur[0];
    h+=`<div class="card">${cur.map(x=>`<div class="lurow"><span class="sl">${esc(x.slot)}</span><span>${esc(x.player)}<span class="tm2">${esc(x.team)}${vsAt(x.team,x.opp)}</span></span><span class="sal">${money0(x.salary)}</span><span class="tnum">${num(x.proj,1)}</span></div>`).join("")}
      <div class="lufoot"><span>${money0(sal)} of $50,000</span><span><b>${num(pr,1)}</b> proj. pts</span>${dst.lu==="gpp"&&g.p_beat_field!=null?`<span>sim mean <b>${num(g.lineup_sim_mean,1)}</b> &middot; ceiling <b>${num(g.lineup_sim_ceiling,1)}</b> &middot; beats the field <b>${pct(g.p_beat_field)}</b></span>`:""}</div></div>`;
    h+=dst.lu==="gpp"
      ?`<p class="note">Tournament lineups come from the joint simulation: stacks get credit for scoring together, and the portfolio maximises the chance that at least one entry wins. Large fields are close to a lottery; cash and small fields are where the projections earn. The DK entry file is dk_gpp_upload.csv in today's folder.</p>`
      :`<p class="note">Cash lineup = the highest projected total under the $50,000 cap and DK roster rules (players from 2+ games, no skaters against your own goalie).</p>`;
  }
  const POS=["C","W","D","G"], st=dst.st;
  h+=`<h2 style="margin-top:14px">Top picks</h2><div class="ctl">${["All",...POS].map(p=>`<button data-pos="${p}" class="${dst.pos===p?"on":""}">${p}</button>`).join("")}<button id="dall" class="${dst.all?"on":""}">${dst.all?"top 8 only":"show all"}</button></div>`;
  const cell=(r,c)=>{const v=r[c.k];
    if(c.k==="player") return `<td class="l"><div class="tm">${logo(r.team,"sm")}<span>${esc(r.player)}<span class="tm2">${esc(r.slot)} &middot; ${esc(r.team)}${vsAt(r.team,r.opp)}${r.src==="sim"?" &middot; sim proj.":""}</span></span></div></td>`;
    if(c.k==="salary") return `<td class="tnum">${fmt0(v)}</td>`;
    return `<td class="tnum">${num(v,c.k==="value"||c.k==="own"?2:1)}</td>`;};
  const body=POS.filter(p=>dst.pos==="All"||dst.pos===p).map(p=>{
    let s=sortRows(rows.filter(r=>r.slot===p),DCOLS,st); if(!dst.all) s=s.slice(0,8);
    return (dst.pos==="All"?`<tr class="grp"><td colspan="${DCOLS.length}">${p==="C"?"Centers":p==="W"?"Wingers":p==="D"?"Defense":"Goalies"}</td></tr>`:"")+
      s.map((r,i)=>`<tr class="${i%2?"band":""}">${DCOLS.map(c=>cell(r,c)).join("")}</tr>`).join("");}).join("");
  h+=`<div class="card tblwrap"><table id="dt"><thead><tr>${tableHead(DCOLS,st)}</tr></thead><tbody>${body}</tbody></table></div>
  <p class="note">Proj = DK points from the Marcel++ rates and tonight's lines (35). Val = points per $1,000 of salary. Ceil and Own come from the joint slate simulation (37, 38). Tap a column to sort.</p>`;
  V.innerHTML=h;
  const b1=document.getElementById("lucash"), b2=document.getElementById("lugpp"), sel=document.getElementById("lunum");
  if(b1) b1.onclick=()=>{dst.lu="cash";dst.n=1;renderDFS();}; if(b2) b2.onclick=()=>{dst.lu="gpp";dst.n=1;renderDFS();};
  if(sel) sel.onchange=()=>{dst.n=Number(sel.value);renderDFS();};
  document.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>{dst.pos=b.dataset.pos;renderDFS();});
  document.getElementById("dall").onclick=()=>{dst.all=!dst.all;renderDFS();};
  bindSort("dt",DCOLS,st,renderDFS);
}

function renderDraft(){
  const d=D.draft; let h=`<h2>Family draft board</h2>`;
  if(!d||!d.skaters||!d.skaters.length){V.innerHTML=h+`<div class="empty">No draft board yet.<small>run_morning() builds it from the latest rates (script 34).</small></div>`;return;}
  const all=draftRows(d); let marks=loadMarks();
  h+=`<p class="sub">${esc(d.league||"")} &middot; built ${esc(d.built||"")} &middot; points over the remaining schedule &middot; tap a row: taken &rarr; mine &rarr; open</p>
  <div class="ctl">${["All","F","D","G"].map(p=>`<button data-dpos="${p}" class="${drst.pos===p?"on":""}">${p}</button>`).join("")}<input id="dq" placeholder="search player or team" value="${esc(drst.q)}" autocomplete="off"><button id="dreset">reset marks</button></div>
  <div class="card sumc" id="dsum"></div>
  <div class="card tblwrap" id="dtw"></div>
  <h2 style="margin-top:14px">Goalies</h2><p class="sub">their own ranking: wins, saves and shutouts in your scoring</p>
  <div class="card tblwrap" id="dgw"></div>
  <p class="note">Rank = value over the replacement player at that position in a ${esc(d.teams||6)}-team league, so forwards, defense and goalies share one order. Tier = a gap in that value. Floor and ceiling bracket the injury and variance noise a season carries. Marks live on this phone only.</p>`;
  V.innerHTML=h;
  const dq=document.getElementById("dq"); let tmr=null;
  dq.oninput=()=>{drst.q=dq.value;clearTimeout(tmr);tmr=setTimeout(drawDraft,120);};
  document.querySelectorAll("[data-dpos]").forEach(b=>b.onclick=()=>{drst.pos=b.dataset.dpos;document.querySelectorAll("[data-dpos]").forEach(x=>x.classList.toggle("on",x.dataset.dpos===drst.pos));drawDraft();});
  document.getElementById("dreset").onclick=()=>{if(confirm("Clear every taken / mine mark?")){marks={};saveMarks(marks);drawDraft();}};
  const rowCls=r=>marks[r.key]==="taken"?"taken":marks[r.key]==="mine"?"mine":"";
  const toggle=tr=>{const k=tr.dataset.key, m=nextMark(marks[k]||""); if(m) marks[k]=m; else delete marks[k]; saveMarks(marks);
    document.querySelectorAll("tr.drow").forEach(x=>{if(x.dataset.key===k){x.classList.remove("taken","mine"); if(m) x.classList.add(m);}}); drawSummary();};
  function drawSummary(){
    const open=g=>all.find(r=>r.grp===g&&!marks[r.key]), nm=g=>{const o=open(g); return o?esc(o.name):"&ndash;";};
    const mine=all.filter(r=>marks[r.key]==="mine"), cnt=g=>mine.filter(r=>r.grp===g).length;
    document.getElementById("dsum").innerHTML=`Best available: <b>F ${nm("F")}</b> &middot; <b>D ${nm("D")}</b> &middot; <b>G ${nm("G")}</b><br>My roster: <b>${cnt("F")} F</b> &middot; <b>${cnt("D")} D</b> &middot; <b>${cnt("G")} G</b> (${mine.length} of ${d.starters_total||16} starters)${mine.length?" &middot; "+esc(mine.map(r=>r.name.split(" ").slice(-1)[0]).join(", ")):""}`;
  }
  function drawDraft(){
    const q=fold(drst.q.trim());
    const flt=all.filter(r=>(drst.pos==="All"||r.grp===drst.pos)&&(!q||fold(r.name).includes(q)||fold(r.team).includes(q)));
    document.getElementById("dtw").innerHTML=`<table><thead><tr><th>#</th><th class="l">Player</th><th>Pts</th><th class="hide-sm">Floor&ndash;ceil</th><th>VORP</th></tr></thead><tbody>${
      flt.map((r,i)=>`<tr class="drow ${i%2?"band":""} ${rowCls(r)}" data-key="${esc(r.key)}"><td class="tnum rk">${r.n}${r.tier!=null?`<span class="tier">${esc(r.tier)}</span>`:""}</td><td class="l"><div class="tm">${logo(r.team,"sm")}<span>${esc(r.name)}<span class="tm2">${esc(r.pos)} &middot; ${esc(r.team)}</span>${r.note?`<span class="onote">${esc(r.note)}</span>`:""}</span></div></td><td class="tnum">${num(r.pts,0)}</td><td class="tnum hide-sm">${r.floor==null?"":num(r.floor,0)+"&ndash;"+num(r.ceil,0)}</td><td class="tnum">${num(r.vorp,0)}</td></tr>`).join("")}</tbody></table>`;
    const gl=all.filter(r=>r.grp==="G");
    document.getElementById("dgw").innerHTML=`<table><thead><tr><th>#</th><th class="l">Goalie</th><th>Starts</th><th>W</th><th class="hide-sm">Saves</th><th>SO</th><th>Pts</th><th>VORP</th></tr></thead><tbody>${
      gl.map((r,i)=>`<tr class="drow ${i%2?"band":""} ${rowCls(r)}" data-key="${esc(r.key)}"><td class="tnum rk">${i+1}</td><td class="l"><div class="tm">${logo(r.team,"sm")}<span>${esc(r.name)}<span class="tm2">${esc(r.team)}</span></span></div></td><td class="tnum">${num(r.gp,0)}</td><td class="tnum">${num(r.wins,0)}</td><td class="tnum hide-sm">${num(r.saves,0)}</td><td class="tnum">${num(r.so,1)}</td><td class="tnum">${num(r.pts,0)}</td><td class="tnum">${num(r.vorp,0)}</td></tr>`).join("")}</tbody></table>`;
    document.querySelectorAll("tr.drow").forEach(tr=>tr.onclick=()=>toggle(tr));
    drawSummary();
  }
  drawDraft();
}

/* ---- router ---- */
const VIEWS={today:renderToday,tomorrow:renderTomorrow,teams:renderTeams,standings:renderStandings,players:renderPlayers,schedule:renderSchedule,dfs:renderDFS,draft:renderDraft};
function route(){
  const h=(location.hash||"#today").slice(1).split("/")[0];
  const v=has(VIEWS,h)?h:"today";
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
  try{ VIEWS[v](); }catch(e){ V.innerHTML=`<div class="empty">Could not render this tab.</div>`; console.error(e); }
  window.scrollTo({top:0,behavior:"auto"});
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
